  <defs>
    <linearGradient id="mascotHeadGradient" x1="116" y1="56" x2="284" y2="154" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a29bfe"/>
      <stop offset="100%" stop-color="#6c5ce7"/>
    </linearGradient>
    <linearGradient id="mascotBodyGradient" x1="126" y1="176" x2="274" y2="344" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a29bfe"/>
      <stop offset="100%" stop-color="#6c5ce7"/>
    </linearGradient>
