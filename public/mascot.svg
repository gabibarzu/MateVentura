<svg viewBox="0 0 400 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cifrel, robotul MateVentura">
  <!-- Shadow -->
  <ellipse cx="200" cy="395" rx="85" ry="14" fill="#000000" fill-opacity="0.12"/>

  <!-- Rocket thruster -->
