      <polygon points="25,87 31,87 28,95" fill="#2d3436"/>
      <rect x="20" y="12" width="16" height="10" rx="2" fill="#e84393"/>
      <rect x="20" y="20" width="16" height="4" fill="#b2bec3"/>
